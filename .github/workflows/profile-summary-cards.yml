name: GitHub Profile Summary Cards

on:
  workflow_dispatch:
  push:
    branches:
      - feat/profile-refresh
    paths:
      - README.md
      - .github/workflows/profile-summary-cards.yml
  schedule:
    - cron: "47 1 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download stats card
        run: |
          mkdir -p profile-summary-card-output/github_dark
          curl --fail --location --retry 3 --retry-delay 5 \
            "https://github-profile-summary-cards.vercel.app/api/cards/stats?username=${{ github.repository_owner }}&theme=github_dark" \
            --output profile-summary-card-output/github_dark/3-stats.svg
      - name: Commit generated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/github_dark/3-stats.svg
          git diff --cached --quiet || git commit -m "chore: update profile summary card [skip ci]"
          git push
