name: Recent Activity

on:
  workflow_dispatch:
  push:
    branches:
      - feat/profile-refresh
    paths:
      - scripts/generate-recent-activity.mjs
      - .github/workflows/recent-activity.yml
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate activity card
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: node scripts/generate-recent-activity.mjs
      - name: Commit generated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recent-activity.svg
          git diff --cached --quiet || git commit -m "chore: update recent activity [skip ci]"
          git push
